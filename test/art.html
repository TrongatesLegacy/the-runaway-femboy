<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#1b1830}</style></head>
<body><canvas id="c" width="1600" height="900"></canvas>
<script type="module">
import { drawAstray, defaultPose } from '/src/art/character.ts';
const c = document.getElementById('c'); const ctx = c.getContext('2d');
const g = ctx.createLinearGradient(0,0,0,900); g.addColorStop(0,'#2b2550'); g.addColorStop(1,'#6b4a7a'); ctx.fillStyle=g; ctx.fillRect(0,0,1600,900);
ctx.fillStyle='#ffffff'; ctx.font='bold 20px sans-serif';
const P = (o) => ({ ...defaultPose(), t: 1.3, ...o });
const items = [
  ['idle :3', P({ expr:'smug' })],
  ['run 0', P({ runAmt:1, run:0, expr:'run' })],
  ['run 1.6', P({ runAmt:1, run:1.6, expr:'run' })],
  ['run 3.1', P({ runAmt:1, run:3.1, expr:'run' })],
  ['jump up', P({ air:1, vy:-900, expr:'run' })],
  ['falling', P({ air:1, vy:700, expr:'run' })],
  ['slide', P({ slide:1, runAmt:1, expr:'run' })],
  ['stumble', P({ stumble:1, expr:'hurt', runAmt:1 })],
  ['panic', P({ runAmt:1, run:0.8, expr:'panic' })],
  ['slap', P({ slap:0.5, holdPie:true, runAmt:1, run:2, expr:'happy' })],
  ['mayo', P({ mayo:1, expr:'blank' })],
  ['regular', P({ outfit:'regular', expr:'happy', wave:1 })],
];
items.forEach(([label, pose], i) => {
  const x = 140 + (i % 6) * 260, y = 380 + Math.floor(i / 6) * 420;
  ctx.fillStyle='rgba(0,0,0,0.25)'; ctx.beginPath(); ctx.ellipse(x, y, 60, 10, 0, 0, Math.PI*2); ctx.fill();
  drawAstray(ctx, x, y, pose, 1.9);
  ctx.fillStyle='#fff'; ctx.fillText(label, x - 40, y + 40);
});
window.__done = true;
</script></body></html>
